services:
  tracker:
    build: .
    image: usd-khr-tracker:latest
    container_name: usd-khr-tracker
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      DATA_DIR: /data
      PRIMARY_PAIR: ${PRIMARY_PAIR:-USD/KHR}
      POLL_INTERVAL_MIN: ${POLL_INTERVAL_MIN:-15}
      SOURCE_URL: ${SOURCE_URL:-https://www.wingbank.com.kh/en/exchange-rate}
      FALLBACK_SOURCES: ${FALLBACK_SOURCES:-https://r.jina.ai/{url}}
      RETENTION_DAYS: ${RETENTION_DAYS:-0}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # Never enable simulation on a host that can reach the bank.
      ALLOW_SIMULATION: ${ALLOW_SIMULATION:-false}
      SIMULATE_ON_FAILURE: ${SIMULATE_ON_FAILURE:-false}
    volumes:
      - tracker-data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  tracker-data:
